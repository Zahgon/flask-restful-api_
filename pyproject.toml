[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-restful-api"
version = "0.1.0"
description = "Rest API on FastAPI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexander Lozovoy", email = "berpress@gmail.com" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "SQLAlchemy==2.0.36",
    "PyJWT==2.10.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["flake8>=6.1.0", "pre-commit>=3.5.0", "pytest==8.3.4"]

[tool.setuptools]
py-modules = ["app", "db", "errors", "run", "security"]
packages = ["models", "resources"]
